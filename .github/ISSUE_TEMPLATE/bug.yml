name: Anomalie
about: Déclarer un incident ou bug CESIZen
title: "[BUG] "
labels: ["bug"]
body:
  - type: dropdown
    id: environment
    attributes:
      label: Environnement
      options: [DEV, TEST, PROD]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: v1.0.0 ou sha-...
    validations:
      required: true
  - type: dropdown
    id: severity
    attributes:
      label: Sévérité
      options: [Bloquant, Majeur, Mineur]
    validations:
      required: true
  - type: dropdown
    id: priority
    attributes:
      label: Priorité
      options: [Critique, Forte, Normale, Basse]
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Étapes de reproduction
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Résultat attendu
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Résultat obtenu
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Logs / captures / informations utiles
