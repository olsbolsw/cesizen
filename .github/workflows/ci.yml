name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Maven tests
        run: |
          chmod +x mvnw
          ./mvnw -B test

  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # If your Angular test runner uses a different CLI, adapt this one line.
      - run: npm test -- --watch=false --browsers=ChromeHeadless
      - run: npm run build

  docker:
    name: Docker build + Compose validation
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Validate Compose merge
        run: docker compose -f compose.yaml -f compose.dev.yaml --env-file .env.example config
      - name: Build Docker images
        run: docker compose -f compose.yaml -f compose.dev.yaml --env-file .env.example build
