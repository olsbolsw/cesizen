name: Build and publish images

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    env:
      SHA: ${{ github.event.workflow_run.head_sha }}
      BACKEND_IMAGE: ghcr.io/${{ github.repository_owner }}/cesizen-backend
      FRONTEND_IMAGE: ghcr.io/${{ github.repository_owner }}/cesizen-frontend
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build and push backend
        run: |
          docker build -t "$BACKEND_IMAGE:sha-$SHA" -t "$BACKEND_IMAGE:latest" ./backend
          docker push "$BACKEND_IMAGE:sha-$SHA"
          docker push "$BACKEND_IMAGE:latest"

      - name: Build and push frontend
        run: |
          docker build -t "$FRONTEND_IMAGE:sha-$SHA" -t "$FRONTEND_IMAGE:latest" ./frontend
          docker push "$FRONTEND_IMAGE:sha-$SHA"
          docker push "$FRONTEND_IMAGE:latest"
