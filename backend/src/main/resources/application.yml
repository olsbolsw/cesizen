spring:
  application:
    name: cesizen-backend

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/cesizen}
    username: ${SPRING_DATASOURCE_USERNAME:cesizen}
    password: ${SPRING_DATASOURCE_PASSWORD:cesizen}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        default_schema: public
    open-in-view: false

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-binding-errors: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

cesizen:
  jwt:
    secret: ${JWT_SECRET:ChangeMeToASecureSecretKeyAtLeast256BitsLongForProductionUse1234567890}
    expiration-ms: 86400000

  cors:
    allowed-origins: http://localhost:4200

logging:
  level:
    org.springframework.security: INFO
    fr.cesi.cesizen: DEBUG