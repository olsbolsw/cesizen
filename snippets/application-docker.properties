# These are examples. Merge them into your existing application.properties/yml,
# do not blindly replace your current configuration.
server.port=${SERVER_PORT:8081}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/cesizen}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:cesizen}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:cesizen}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

