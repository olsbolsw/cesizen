<mat-card class="auth-card">
  <mat-card-header>
    <mat-card-title>Inscription</mat-card-title>
    <mat-card-subtitle>Créez votre compte en quelques secondes</mat-card-subtitle>
  </mat-card-header>
  <mat-card-content>
    <form [formGroup]="form" (ngSubmit)="submit()">
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Prénom</mat-label>
        <input matInput formControlName="firstName" autocomplete="given-name" />
      </mat-form-field>

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Nom</mat-label>
        <input matInput formControlName="lastName" autocomplete="family-name" />
      </mat-form-field>

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Email</mat-label>
        <input matInput type="email" formControlName="email" autocomplete="email" />
      </mat-form-field>

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Mot de passe</mat-label>
        <input matInput type="password" formControlName="password" autocomplete="new-password" />
      </mat-form-field>

      <mat-checkbox formControlName="rgpdConsent" class="rgpd-check">
        J'accepte le traitement de mes données personnelles (RGPD)
      </mat-checkbox>

      <button mat-raised-button color="primary" type="submit" [disabled]="loading">
        Créer mon compte
      </button>
    </form>
    <p class="link">Déjà inscrit ? <a routerLink="/auth/login">Se connecter</a></p>
  </mat-card-content>
</mat-card>
<p-toast />
